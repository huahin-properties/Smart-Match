<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#0B1829; --gold:#C9A84C; --bg:#F0F3F5; --white:#fff; --border:#E1E8ED;
      --red:#B12A3B; --muted:#7B8794; --shadow:0 6px 20px rgba(0,0,0,.08);
      --radius:14px;
    }

    body.is-line{ zoom:.92; -moz-transform:scale(.92); -moz-transform-origin:0 0; }

    *{box-sizing:border-box}
    body{
      font-family:'Montserrat','Sarabun',sans-serif;
      background:var(--bg);
      margin:0; padding:0;
      color:var(--navy);
      overflow-x:hidden;
    }

    /* Header */
    .header{
      background:var(--navy);
      color:var(--white);
      padding:12px 12px 10px;
      position:sticky; top:0; z-index:100;
      border-bottom:3px solid var(--gold);
      box-shadow:0 2px 8px rgba(0,0,0,.14);
    }
    .header-top{
      display:flex; align-items:center; justify-content:center; position:relative;
    }
    .title{
      margin:0;
      font-size:16px;
      font-weight:900;
      letter-spacing:.12em;
      display:flex; align-items:center; gap:10px;
      text-transform:uppercase;
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 0 3px rgba(201,168,76,.18);
      display:inline-block;
    }
    .btn-refresh{
      position:absolute; right:4px; top:50%; transform:translateY(-50%);
      width:42px; height:34px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      color:#fff;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:16px;
    }
    .btn-refresh:active{ transform:translateY(-50%) scale(.98); }

    /* Filters panel (NO SEARCH) */
    .panel{
      background:var(--white);
      border-bottom:1px solid var(--border);
      padding:10px 10px 10px;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:8px;
    }
    .field{
      display:flex; flex-direction:column; gap:6px;
    }
    label{
      font-size:10px;
      font-weight:900;
      letter-spacing:.10em;
      color:#667085;
      text-transform:uppercase;
    }
    select{
      width:100%;
      padding:11px 12px;
      border:1.5px solid var(--border);
      border-radius:12px;
      outline:none;
      font-family:'Sarabun';
      font-size:14px;
      background:#fff;
    }

    /* Pills type */
    .pill-box{
      display:flex; gap:6px;
      overflow-x:auto;
      padding:10px 0 2px;
      scrollbar-width:none;
    }
    .pill-box::-webkit-scrollbar{ display:none; }
    .pill{
      white-space:nowrap;
      padding:7px 12px;
      border-radius:999px;
      background:#E9EEF3;
      font-size:11px;
      font-weight:900;
      color:#475467;
      cursor:pointer;
      border:none;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .pill.active{
      background:var(--gold);
      color:#0B1829;
    }

    /* Meta row */
    .meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 10px 0;
      color:#667085;
      font-weight:800;
      font-size:11px;
    }
    .gas-pill{
      display:inline-flex; align-items:center; gap:8px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 10px;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      white-space:nowrap;
    }
    .gas-dot{
      width:10px; height:10px; border-radius:50%;
      background:#D92D20;
      box-shadow:0 0 0 3px rgba(217,45,32,.15);
    }

    /* List */
    .list{
      padding:10px 10px 110px;
    }
    .card{
      background:var(--white);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 1px 10px rgba(0,0,0,.04);
      display:flex;
      gap:10px;
      padding:10px;
      margin-bottom:8px;
      overflow:hidden;
    }
    .thumb{
      width:92px;
      height:68px;
      border-radius:12px;
      background:#0B1829;
      flex:0 0 92px;
      overflow:hidden;
      position:relative;
    }
    .thumb img{
      width:100%; height:100%;
      object-fit:cover; display:block;
      filter:saturate(1.05) contrast(1.02);
    }
    .thumb::after{
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(90deg, rgba(11,24,41,.08), rgba(11,24,41,.38));
      pointer-events:none;
    }
    .col{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
      padding-top:1px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
    }
    .zone{
      font-size:14px;
      font-weight:900;
      color:var(--navy);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .price{
      font-size:16px;
      font-weight:900;
      color:var(--red);
      white-space:nowrap;
      letter-spacing:.02em;
    }
    .sub{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      font-family:'Sarabun';
      color:#667085;
      font-size:12px;
      font-weight:700;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#F6F8FB;
      border:1px solid #EEF2F6;
      padding:6px 8px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      color:#344054;
    }
    .note{
      font-family:'Sarabun';
      color:#98A2B3;
      font-size:11px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Workflow */
    .workflow{
      display:flex; gap:7px; margin-top:2px;
    }
    .step{
      width:30px; height:30px;
      border-radius:10px;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      font-size:12px;
      background:#F8FAFC;
      border:1px solid #EEF2F6;
      cursor:pointer;
      transition:.15s;
      user-select:none;
    }
    .step:active{ transform:scale(.98); }
    .lbl{
      font-size:6px;
      font-weight:900;
      color:#98A2B3;
      letter-spacing:.10em;
      text-transform:uppercase;
      margin-top:1px;
    }
    .done{
      border-color:#2ECA8B;
      background:#E9F9F0;
      color:#2ECA8B;
    }

    /* FAB + Modal */
    .fab{
      position:fixed;
      bottom:22px; right:22px;
      width:64px; height:64px;
      background:var(--gold);
      border:none;
      border-radius:50%;
      color:#0B1829;
      font-size:32px;
      font-weight:900;
      box-shadow:0 10px 24px rgba(0,0,0,.18);
      cursor:pointer;
      z-index:999;
    }
    #modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      z-index:2000;
      padding:14px;
    }
    .modal-box{
      background:#fff;
      border-radius:16px;
      max-width:520px;
      margin: auto;
      padding:16px;
    }
    .modal-title{
      margin:0 0 10px;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#0B1829;
    }
    .input, textarea{
      width:100%;
      padding:12px;
      border:1.5px solid var(--border);
      border-radius:12px;
      outline:none;
      font-family:'Sarabun';
      font-size:14px;
      margin-bottom:8px;
    }
    .row2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .btn-save{
      width:100%;
      padding:14px;
      background:var(--navy);
      color:#fff;
      border:none;
      border-radius:12px;
      font-weight:1000;
      letter-spacing:.08em;
      cursor:pointer;
    }
    .btn-cancel{
      width:100%;
      padding:12px;
      background:transparent;
      border:none;
      color:#98A2B3;
      font-weight:900;
      margin-top:8px;
      cursor:pointer;
    }

    /* Loading */
    #loading{
      text-align:center;
      padding:24px;
      color:#98A2B3;
      font-weight:900;
      font-size:12px;
      letter-spacing:.12em;
    }
    .empty{
      text-align:center;
      padding:40px 10px;
      color:#98A2B3;
      font-weight:900;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-top">
      <h1 class="title"><span class="dot"></span>SMART MATCH PRO</h1>
      <button class="btn-refresh" onclick="reloadData()" title="Refresh">↻</button>
    </div>
  </div>

  <!-- ✅ NO SEARCH — ใช้คลิก Filter อย่างเดียว -->
  <div class="panel">
    <div class="grid">
      <div class="field">
        <label>Sort Price</label>
        <select id="sortPrice" onchange="applyFilters()">
          <option value="">None</option>
          <option value="low">Low → High</option>
          <option value="high">High → Low</option>
        </select>
      </div>

      <div class="field">
        <label>Zone</label>
        <select id="selZone" onchange="applyFilters()">
          <option value="">All Zones</option>
        </select>
      </div>

      <div class="field">
        <label>Beds</label>
        <select id="selBeds" onchange="applyFilters()">
          <option value="">All</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5+</option>
        </select>
      </div>

      <div class="field">
        <label>Land Area</label>
        <select id="selLand" onchange="applyFilters()">
          <option value="">All</option>
          <option value="0-300">≤ 300</option>
          <option value="300-600">300–600</option>
          <option value="600-1000">600–1000</option>
          <option value="1000-999999">≥ 1000</option>
        </select>
      </div>

      <div class="field" style="grid-column:1 / -1;">
        <label>Price Range (Million THB)</label>
        <select id="selPrice" onchange="applyFilters()">
          <option value="">All</option>
          <option value="0-5">≤ 5M</option>
          <option value="5-10">5–10M</option>
          <option value="10-20">10–20M</option>
          <option value="20-999999">≥ 20M</option>
        </select>
      </div>
    </div>

    <div class="pill-box" id="pillBox">
      <button class="pill active" data-f="all">ALL</button>
      <button class="pill" data-f="House">HOUSE</button>
      <button class="pill" data-f="Condo">CONDO</button>
      <button class="pill" data-f="Pool Villa">POOL VILLA</button>
      <button class="pill" data-f="Land">LAND</button>
      <button class="pill" data-f="Commercial">COMMERCIAL</button>
      <button class="pill" data-f="Others">OTHERS</button>
    </div>
  </div>

  <div class="meta">
    <div>
      <span id="metaCount">Records: 0</span> • <span id="metaType">Type: ALL</span><br>
      <span id="metaUpdated">Updated: —</span>
    </div>
    <div class="gas-pill">
      <span class="gas-dot"></span>
      <span>No GAS (Open via Web App)</span>
    </div>
  </div>

  <div id="loading">SYNCHRONIZING DATABASE...</div>
  <div class="list" id="list"></div>

  <!-- Modal -->
  <div id="modal">
    <div class="modal-box">
      <h2 class="modal-title">Add New Record</h2>

      <form id="addForm">
        <input class="input" type="url" name="Thumb_URL" placeholder="Thumbnail URL (ภาพบ้านเล็กๆ) — https://..." required>
        <input class="input" type="url" name="Source_URL" placeholder="Source URL (optional) — https://...">

        <div class="row2">
          <input class="input" type="number" name="Price" placeholder="Price (บาท) เช่น 6900000" required>
          <input class="input" type="number" name="Bedrooms" placeholder="Beds" required>
        </div>

        <div class="row2">
          <input class="input" type="number" name="Land_Area" placeholder="Land Area (ตัวเลข) เช่น 320" required>
          <input class="input" type="text" name="Zone" placeholder="Zone เช่น หัวหิน / บ่อฝ้าย" required>
        </div>

        <select class="input" name="Type" required>
          <option value="House">House</option>
          <option value="Condo">Condo</option>
          <option value="Pool Villa">Pool Villa</option>
          <option value="Land">Land</option>
          <option value="Commercial">Commercial</option>
          <option value="Others">Others</option>
        </select>

        <textarea class="input" name="Notes" rows="2" placeholder="Internal Notes (optional)"></textarea>

        <button class="btn-save" type="submit" id="saveBtn">SAVE</button>
        <button class="btn-cancel" type="button" onclick="toggleModal()">CANCEL</button>
      </form>
    </div>
  </div>

  <button class="fab" onclick="toggleModal()">+</button>

  <script>
    let masterData = [];
    let activeType = "all";

    window.onload = () => {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf("Line") > -1) document.body.classList.add("is-line");
      reloadData();
    };

    function reloadData(){
      document.getElementById('loading').style.display = 'block';
      document.getElementById('list').innerHTML = '';
      google.script.run.withSuccessHandler(data => {
        if (data && data.error) { alert(data.error); return; }
        masterData = Array.isArray(data) ? data : [];
        document.getElementById('loading').style.display = 'none';
        buildZoneOptions();
        applyFilters();
        stampMeta();
      }).getSmartData();
    }

    function stampMeta(){
      const d = new Date();
      const th = d.toLocaleString('th-TH');
      document.getElementById('metaUpdated').textContent = `Updated: ${th}`;
    }

    function buildZoneOptions(){
      const sel = document.getElementById('selZone');
      const prev = sel.value;
      const zones = [...new Set(masterData.map(x => String(x.Zone||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
      sel.innerHTML = `<option value="">All Zones</option>` + zones.map(z => `<option value="${escapeHtml(z)}">${escapeHtml(z)}</option>`).join('');
      if (zones.includes(prev)) sel.value = prev;
    }

    function applyFilters(){
      const sort = document.getElementById('sortPrice').value;
      const zone = document.getElementById('selZone').value.trim();
      const beds = document.getElementById('selBeds').value;
      const land = document.getElementById('selLand').value;
      const pr   = document.getElementById('selPrice').value;

      let items = masterData.slice();

      // type pill
      if (activeType !== 'all') {
        items = items.filter(x => String(x.Type||'').trim() === activeType);
      }

      // zone
      if (zone) {
        items = items.filter(x => String(x.Zone||'').trim() === zone);
      }

      // beds exact / 5+
      if (beds) {
        const b = Number(beds);
        items = items.filter(x => {
          const v = Number(x.Bedrooms||0);
          return (beds === '5') ? (v >= 5) : (v === b);
        });
      }

      // land range
      if (land) {
        const [mn, mx] = land.split('-').map(Number);
        items = items.filter(x => {
          const v = Number(x.Land_Area||0);
          return v >= mn && v <= mx;
        });
      }

      // price range (ล้าน)
      if (pr) {
        const [mn, mx] = pr.split('-').map(Number);
        items = items.filter(x => {
          const v = Number(x.Price||0) / 1e6;
          return v >= mn && v <= mx;
        });
      }

      // sort
      if (sort === 'low') items.sort((a,b) => Number(a.Price||0) - Number(b.Price||0));
      if (sort === 'high') items.sort((a,b) => Number(b.Price||0) - Number(a.Price||0));

      render(items);

      document.getElementById('metaCount').textContent = `Records: ${items.length}`;
      document.getElementById('metaType').textContent = `Type: ${activeType.toUpperCase()}`;
    }

    function render(items){
      const el = document.getElementById('list');
      if (!items.length){
        el.innerHTML = `<div class="empty">NO RESULTS</div>`;
        return;
      }

      el.innerHTML = items.map(x => cardHtml(x)).join('');
    }

    function cardHtml(x){
      const thumb = String(x.Thumb_URL||'').trim();
      const zone  = String(x.Zone||'-').trim() || '-';
      const beds  = Number(x.Bedrooms||0) || 0;
      const land  = Number(x.Land_Area||0) || 0;
      const price = Number(x.Price||0) || 0;
      const type  = String(x.Type||'').trim() || '-';
      const note  = String(x.Notes||'').trim();
      const url   = String(x.Source_URL||'').trim();
      const row   = Number(x._row);

      const pPrettyM = price ? (price/1e6).toFixed(1) + "M" : "—";
      const landTxt = land ? `${land} area` : `— area`; // คุณจะเปลี่ยนเป็น "sqm" หรือ "sq.w" ได้ตามที่คุณใช้จริง

      const imgHtml = thumb
        ? `<img src="${escapeAttr(thumb)}" alt="thumb" loading="lazy" decoding="async" onerror="this.style.display='none'">`
        : ``;

      return `
        <div class="card" onclick="${url ? `openLink('${escapeAttr(url)}')` : ''}">
          <div class="thumb">${imgHtml}</div>

          <div class="col">
            <div class="top">
              <div class="zone">${escapeHtml(zone)}</div>
              <div class="price">฿${pPrettyM}</div>
            </div>

            <div class="sub">
              <span class="chip">🛏 ${beds || '—'} Beds</span>
              <span class="chip">📐 ${escapeHtml(landTxt)}</span>
              <span class="chip">🏷 ${escapeHtml(type)}</span>
            </div>

            <div class="note">${escapeHtml(note || '—')}</div>

            <div class="workflow" onclick="event.stopPropagation()">
              ${stepBtn(row,'Step1_Talk','✔','Talk', x.Step1_Talk)}
              ${stepBtn(row,'Step2_Survey','📸','Survey', x.Step2_Survey)}
              ${stepBtn(row,'Step3_Post','🌐','Post', x.Step3_Post)}
              ${stepBtn(row,'Step4_Other','🏆','Done', x.Step4_Other)}
            </div>
          </div>
        </div>
      `;
    }

    function stepBtn(row, col, icon, label, val){
      const done = String(val||'').trim().toLowerCase() === 'done';
      return `
        <div class="step ${done ? 'done' : ''}" onclick="toggleStep(${row}, '${col}')">
          <div>${icon}</div>
          <div class="lbl">${label}</div>
        </div>
      `;
    }

    function toggleStep(row, col){
      google.script.run.withSuccessHandler(res => {
        if(res && res.ok) reloadData();
      }).toggleStep(row, col);
    }

    function openLink(url){
      try { window.open(url, '_blank'); } catch(e) {}
    }

    function toggleModal(){
      const m = document.getElementById('modal');
      m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    document.getElementById('addForm').onsubmit = (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.textContent = 'SAVING...';
      btn.disabled = true;

      const fd = Object.fromEntries(new FormData(e.target));
      google.script.run.withSuccessHandler(res => {
        btn.textContent = 'SAVE';
        btn.disabled = false;

        if(res && res.ok){
          toggleModal();
          e.target.reset();
          reloadData();
        } else {
          alert(res?.error || 'Save failed');
        }
      }).saveNewListing(fd);
    };

    document.getElementById('pillBox').addEventListener('click', (e) => {
      const btn = e.target.closest('.pill');
      if(!btn) return;
      document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.f;
      applyFilters();
    });

    function escapeHtml(s){
      return String(s ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }
    function escapeAttr(s){ return escapeHtml(s); }
  </script>

</body>
</html>
