<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#0B1829; --gold:#C9A84C; --bg:#F0F3F5; --white:#FFFFFF;
      --border:#E1E8ED; --red:#B12A3B; --green:#28A745;
      --muted:#6B7280;
      --shadow: 0 6px 18px rgba(0,0,0,.08);
      --radius:10px;
      --rowh: 40px;
      --hdrh: 46px;
    }

    /* scaling for LINE */
    body.is-line { zoom: 0.9; -moz-transform: scale(0.9); -moz-transform-origin: 0 0; }

    *{box-sizing:border-box}
    body{
      font-family:'Montserrat','Sarabun',sans-serif;
      background:var(--bg);
      margin:0;
      padding:0;
      color:var(--navy);
      overflow-x:hidden;
    }

    /* ===== Header ===== */
    .header{
      background:var(--navy);
      color:var(--white);
      padding:10px 12px;
      text-align:center;
      border-bottom:3px solid var(--gold);
      position:sticky; top:0; z-index:200;
      box-shadow:0 2px 10px rgba(0,0,0,.14);
    }
    .header h1{
      margin:0;
      font-size:14px;
      letter-spacing:1px;
      font-weight:800;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .header .mini-actions{
      position:absolute; right:10px; top:8px;
      display:flex; gap:8px; align-items:center;
    }
    .iconbtn{
      width:34px;height:34px;border-radius:10px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      color:var(--white);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:.15s;
    }
    .iconbtn:active{transform:scale(.98)}
    .iconbtn:hover{background:rgba(255,255,255,.12)}
    .brand-dot{
      width:8px;height:8px;border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 0 4px rgba(201,168,76,.18);
    }

    /* ===== Search Panel ===== */
    .search-panel{
      background:var(--white);
      padding:10px;
      border-bottom:1px solid var(--border);
      position:sticky; top:48px; z-index:180;
    }
    .input-box{
      width:100%;
      padding:10px;
      border:1.5px solid var(--border);
      border-radius:10px;
      font-size:14px;
      outline:none;
      margin-bottom:6px;
      font-family:'Sarabun';
      background:#fff;
    }
    .filter-grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr .8fr;
      gap:6px;
      margin-bottom:6px;
    }
    select{
      padding:10px;
      border-radius:10px;
      border:1.5px solid var(--border);
      font-family:'Sarabun';
      font-size:13px;
      outline:none;
      background:#fff;
    }

    .pill-box{
      display:flex; gap:6px; overflow-x:auto;
      padding:2px 0 6px;
      scrollbar-width:none;
    }
    .pill-box::-webkit-scrollbar{display:none}
    .pill{
      white-space:nowrap;
      padding:6px 12px;
      border-radius:999px;
      background:#E9EEF3;
      font-size:10px;
      font-weight:800;
      color:#475569;
      cursor:pointer;
      border:none;
      letter-spacing:.4px;
    }
    .pill.active{
      background:linear-gradient(135deg,var(--gold),#e7cc7a);
      color:#0B1829;
    }

    /* ===== Workspace ===== */
    .wrap{
      padding:8px 8px 110px;
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:8px;
      margin:6px 2px 10px;
    }
    .statline{
      font-size:11px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.3px;
    }
    .badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 2px 8px rgba(0,0,0,.04);
      font-size:11px;
      font-weight:800;
      color:#334155;
      white-space:nowrap;
    }
    .badge .dot{
      width:8px;height:8px;border-radius:50%;
      background:#94a3b8;
    }
    .badge.ok .dot{background:var(--green)}
    .badge.warn .dot{background:var(--red)}

    /* ===== Excel-like Grid ===== */
    .sheet{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .sheet-scroll{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      max-height: calc(100dvh - 250px);
    }

    table{
      border-collapse:separate;
      border-spacing:0;
      width:100%;
      min-width: 980px; /* ให้เหมือน excel และเลื่อนได้บนมือถือ */
      font-family:'Sarabun';
    }

    thead th{
      position:sticky; top:0; z-index:5;
      height:var(--hdrh);
      background:linear-gradient(180deg,#0B1829,#0a1626);
      color:#fff;
      font-weight:800;
      font-size:11px;
      letter-spacing:.6px;
      text-transform:uppercase;
      border-bottom:1px solid rgba(255,255,255,.12);
      padding:10px 10px;
      white-space:nowrap;
    }
    thead th:first-child{border-top-left-radius:0}
    thead th:last-child{border-top-right-radius:0}

    tbody td{
      height:var(--rowh);
      border-bottom:1px solid #eef2f7;
      padding:6px 10px;
      font-size:12px;
      color:#0f172a;
      background:#fff;
      vertical-align:middle;
      white-space:nowrap;
    }
    tbody tr:nth-child(even) td{background:#fbfdff}
    tbody tr:hover td{background:#f6fbff}

    .cell-muted{color:#64748b}
    .cell-id{
      font-weight:800;
      color:#8a6a12;
      letter-spacing:.5px;
      font-family:'Montserrat';
      font-size:11px;
    }

    /* Editable cells */
    .celledit{
      width:100%;
      border:1px solid transparent;
      border-radius:8px;
      padding:6px 8px;
      font-size:12px;
      outline:none;
      background:transparent;
      transition:.12s;
      font-family:'Sarabun';
      min-width: 60px;
    }
    .celledit:focus{
      background:#fff;
      border-color:rgba(201,168,76,.55);
      box-shadow:0 0 0 3px rgba(201,168,76,.18);
    }
    .celledit.num{ text-align:right; font-family:'Montserrat'; font-weight:800; }
    .price-hero{ color:var(--red); }

    /* Step toggles */
    .steps{
      display:flex; gap:6px; align-items:center;
    }
    .stepbtn{
      width:32px; height:30px;
      border-radius:8px;
      border:1px solid #e6edf4;
      background:#f8fafc;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      cursor:pointer;
      transition:.12s;
      user-select:none;
    }
    .stepbtn:active{transform:scale(.98)}
    .stepbtn .lbl{
      font-size:8px;
      font-weight:900;
      color:#94a3b8;
      letter-spacing:.5px;
      text-transform:uppercase;
      margin-top:1px;
      font-family:'Montserrat';
    }
    .stepbtn.done{
      border-color: rgba(40,167,69,.5);
      background:#eaf7ee;
      color:var(--green);
    }
    .stepbtn.done .lbl{color:rgba(40,167,69,.9)}
    .stepbtn.pending{
      color:#cbd5e1;
    }

    /* Link button */
    .linkbtn{
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #e6edf4;
      background:#fff;
      font-weight:800;
      font-size:11px;
      cursor:pointer;
      display:inline-flex;align-items:center;gap:6px;
      color:#0B1829;
      transition:.12s;
    }
    .linkbtn:hover{background:#f8fafc}
    .linkbtn .mini{color:#64748b;font-weight:900}

    /* Status pill (optional text) */
    .typepill{
      display:inline-flex;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #e6edf4;
      background:#fff;
      font-weight:900;
      font-size:11px;
      letter-spacing:.5px;
      font-family:'Montserrat';
      color:#334155;
    }

    /* ===== Loading / Empty ===== */
    #loading{
      text-align:center;
      padding:26px 10px;
      color:#94a3b8;
      font-weight:900;
      font-size:12px;
      letter-spacing:.6px;
    }
    .empty{
      padding:28px;
      text-align:center;
      color:#94a3b8;
      font-weight:900;
    }

    /* ===== FAB & Modal ===== */
    .fab{
      position:fixed;
      bottom:18px; right:18px;
      width:56px; height:56px;
      background:linear-gradient(135deg,var(--gold),#e7cc7a);
      color:#0B1829;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:30px;
      box-shadow:0 10px 26px rgba(0,0,0,.28);
      border:none;
      z-index:250;
      cursor:pointer;
      font-weight:900;
    }
    #modal{
      display:none;
      position:fixed; inset:0;
      background:rgba(0,0,0,0.78);
      z-index:1000;
      padding:14px;
    }
    .modal-box{
      background:#fff;
      padding:16px;
      border-radius:14px;
      max-width:480px;
      margin: 12px auto;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    .btn-save{
      background:linear-gradient(135deg,var(--gold),#e7cc7a);
      color:#0B1829;
      border:none;
      padding:14px;
      border-radius:12px;
      font-weight:900;
      width:100%;
      margin-top:10px;
      font-size:15px;
      cursor:pointer;
    }

    /* ===== Mobile tuning ===== */
    @media (max-width:520px){
      .filter-grid{grid-template-columns: 1fr 1fr; }
      .filter-grid .bedsbox{grid-column:1 / -1;}
      .search-panel{top:48px}
      .sheet-scroll{max-height: calc(100dvh - 270px);}
      .header h1{font-size:13px}
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="mini-actions">
      <button class="iconbtn" title="Reload" onclick="location.reload()">↻</button>
    </div>
    <h1><span class="brand-dot"></span> SMART MATCH PRO</h1>
  </div>

  <div class="search-panel">
    <input type="text" id="qSearch" class="input-box" placeholder="Search (Zone, ID, Notes, URL...)" oninput="filterData()">

    <div class="filter-grid">
      <select id="sortPrice" onchange="filterData()">
        <option value="">Sort Price</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>

      <select id="typeFilter" onchange="filterData()">
        <option value="">Type: All</option>
        <option value="House">House</option>
        <option value="Condo">Condo</option>
        <option value="Pool Villa">Pool Villa</option>
        <option value="Land">Land</option>
        <option value="Commercial">Commercial</option>
        <option value="Others">Others</option>
      </select>

      <input type="number" id="bedSearch" class="input-box bedsbox" placeholder="Beds (exact)" oninput="filterData()" style="margin:0;">
    </div>

    <div class="pill-box" id="pillBox">
      <button class="pill active" data-f="all">ALL</button>
      <button class="pill" data-f="House">HOUSE</button>
      <button class="pill" data-f="Condo">CONDO</button>
      <button class="pill" data-f="Pool Villa">POOL VILLA</button>
      <button class="pill" data-f="Land">LAND</button>
      <button class="pill" data-f="Commercial">COMMERCIAL</button>
      <button class="pill" data-f="Others">OTHERS</button>
    </div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <div class="statline" id="statLine">—</div>
      <div class="badge" id="connBadge"><span class="dot"></span><span id="connText">Checking…</span></div>
    </div>

    <div id="loading">SYNCHRONIZING DATABASE...</div>

    <div class="sheet" id="sheet" style="display:none;">
      <div class="sheet-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:110px;">ID</th>
              <th style="width:120px;">TYPE</th>
              <th style="width:170px;">ZONE</th>
              <th style="width:140px;text-align:right;">PRICE</th>
              <th style="width:90px;text-align:right;">BEDS</th>
              <th style="width:320px;">NOTES</th>
              <th style="width:160px;">WORKFLOW</th>
              <th style="width:120px;">SOURCE</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="empty" id="empty" style="display:none;">NO RESULTS</div>
  </div>

  <!-- Modal -->
  <div id="modal">
    <div class="modal-box">
      <h2 style="margin:0 0 12px; font-size:16px; letter-spacing:.6px;">ADD NEW RECORD</h2>
      <form id="addForm">
        <input type="url" name="Source_URL" placeholder="Listing URL (https://...)" required class="input-box">
        <div style="display:flex; gap:6px;">
          <input type="number" name="Price" placeholder="Price" required class="input-box" style="margin-bottom:6px;">
          <input type="number" name="Bedrooms" placeholder="Beds" required class="input-box" style="margin-bottom:6px;">
        </div>
        <input type="text" name="Zone" placeholder="Zone (e.g. Bor Fai)" required class="input-box">
        <select name="Type" class="input-box" style="margin-bottom:8px;">
          <option value="House">House</option>
          <option value="Condo">Condo</option>
          <option value="Pool Villa">Pool Villa</option>
          <option value="Land">Land</option>
          <option value="Commercial">Commercial</option>
          <option value="Others">Others</option>
        </select>
        <textarea name="Notes" placeholder="Internal Notes..." class="input-box" rows="2"></textarea>

        <button type="submit" class="btn-save" id="saveBtn">SAVE TO DATABASE</button>
        <button type="button" onclick="toggleModal()" style="background:none; border:none; color:#94a3b8; width:100%; margin-top:10px; font-weight:900; cursor:pointer;">CANCEL</button>
      </form>
    </div>
  </div>

  <button class="fab" onclick="toggleModal()">+</button>

  <script>
    let masterData = [];
    let activePill = "all";

    // ---- GAS availability check (สำคัญ: ถ้าเปิดจาก GitHub จะไม่มี google.script.run) ----
    function hasGAS() {
      return (typeof google !== "undefined" && google.script && google.script.run);
    }

    window.onload = () => {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf("Line") > -1) document.body.classList.add('is-line');

      // connection badge
      const badge = document.getElementById("connBadge");
      const text  = document.getElementById("connText");

      if (hasGAS()) {
        badge.classList.add("ok");
        text.textContent = "Connected (GAS)";
        fetchData();
      } else {
        badge.classList.add("warn");
        text.textContent = "No GAS (Open via Web App)";
        // โหมด fallback: โหลดจาก localStorage เพื่อ “ใช้งานส่วนตัว” ได้ แม้ไม่ผ่าน GAS
        masterData = loadLocal();
        document.getElementById('loading').style.display = 'none';
        render(masterData);
      }
    };

    // ===== Local fallback (optional) =====
    function loadLocal() {
      try {
        const raw = localStorage.getItem("SMP_LOCAL");
        if (!raw) return [];
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch(e){ return []; }
    }
    function saveLocal() {
      try { localStorage.setItem("SMP_LOCAL", JSON.stringify(masterData)); } catch(e){}
    }

    // ===== Fetch =====
    function fetchData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('sheet').style.display = 'none';
      document.getElementById('empty').style.display = 'none';

      google.script.run
        .withSuccessHandler(data => {
          if (data && data.error) { alert(data.error); return; }
          masterData = Array.isArray(data) ? data : [];
          document.getElementById('loading').style.display = 'none';
          render(masterData);
        })
        .withFailureHandler(err => {
          document.getElementById('loading').style.display = 'none';
          alert("GAS Error: " + (err && err.message ? err.message : err));
        })
        .getSmartData();
    }

    // ===== Render (Excel-like) =====
    function render(items) {
      const sheet = document.getElementById('sheet');
      const empty = document.getElementById('empty');
      const tbody = document.getElementById('tbody');

      // stat
      document.getElementById("statLine").textContent =
        `Records: ${items.length}  •  Type: ${activePill.toUpperCase()}  •  Updated: ${new Date().toLocaleString()}`;

      if (!items || items.length === 0) {
        sheet.style.display = 'none';
        empty.style.display = 'block';
        tbody.innerHTML = '';
        return;
      }

      empty.style.display = 'none';
      sheet.style.display = 'block';

      tbody.innerHTML = items.map(item => rowHtml(item)).join('');
      attachRowEvents();
    }

    function rowHtml(item){
      const id    = item.ID ?? '';
      const type  = item.Type ?? '';
      const zone  = item.Zone ?? '';
      const beds  = item.Bedrooms ?? '';
      const notes = item.Notes ?? '';
      const price = Number(item.Price || 0);

      const url   = (item.Source_URL || '').replace(/"/g,'&quot;');

      return `
        <tr data-row="${item._row ?? ''}" data-id="${String(id).replace(/"/g,'&quot;')}">
          <td><span class="cell-id">#${id}</span></td>

          <td>
            <select class="celledit" data-field="Type" style="padding:6px 8px;">
              ${opt(type,'House')}
              ${opt(type,'Condo')}
              ${opt(type,'Pool Villa')}
              ${opt(type,'Land')}
              ${opt(type,'Commercial')}
              ${opt(type,'Others')}
            </select>
          </td>

          <td><input class="celledit" data-field="Zone" value="${escapeAttr(zone)}" /></td>

          <td style="text-align:right;">
            <input class="celledit num price-hero" data-field="Price" inputmode="numeric" value="${price ? price : ''}" />
          </td>

          <td style="text-align:right;">
            <input class="celledit num" data-field="Bedrooms" inputmode="numeric" value="${escapeAttr(beds)}" />
          </td>

          <td>
            <input class="celledit" data-field="Notes" value="${escapeAttr(notes)}" />
          </td>

          <td>
            <div class="steps">
              <div class="stepbtn ${isDone(item.Step1_Talk)}" data-step="Step1_Talk" title="Talk"><div>✔</div><div class="lbl">Talk</div></div>
              <div class="stepbtn ${isDone(item.Step2_Survey)}" data-step="Step2_Survey" title="Survey"><div>📸</div><div class="lbl">Survey</div></div>
              <div class="stepbtn ${isDone(item.Step3_Post)}" data-step="Step3_Post" title="Post"><div>🌐</div><div class="lbl">Post</div></div>
              <div class="stepbtn ${isDone(item.Step4_Other)}" data-step="Step4_Other" title="Done"><div>🏆</div><div class="lbl">Done</div></div>
            </div>
          </td>

          <td>
            <button class="linkbtn" data-url="${url}">Open <span class="mini">↗</span></button>
          </td>
        </tr>
      `;
    }

    function opt(current, val){
      const sel = String(current).trim() === val ? 'selected' : '';
      return `<option value="${val}" ${sel}>${val}</option>`;
    }

    function escapeAttr(s){
      return String(s ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function isDone(v) {
      return (String(v).toLowerCase().trim() === 'done') ? 'done' : 'pending';
    }

    // ===== Events (Inline Edit + Steps) =====
    function attachRowEvents(){
      // open url
      document.querySelectorAll('.linkbtn').forEach(btn=>{
        btn.onclick = (e)=>{
          e.preventDefault();
          const url = btn.getAttribute('data-url') || '';
          if(url) window.open(url, '_blank');
        };
      });

      // inline edits -> save
      document.querySelectorAll('.celledit').forEach(inp=>{
        inp.addEventListener('change', (e)=>{
          const tr = e.target.closest('tr');
          const row = tr ? tr.getAttribute('data-row') : '';
          const field = e.target.getAttribute('data-field');
          let value = e.target.value;

          // normalize numeric
          if(field === 'Price' || field === 'Bedrooms'){
            value = String(value || '').replace(/[^\d]/g,'');
          }

          // update local masterData (ทันที)
          const id = tr.getAttribute('data-id');
          const idx = masterData.findIndex(x => String(x.ID) === String(id));
          if(idx >= 0){
            masterData[idx][field] = value;
            saveLocal(); // fallback
          }

          // ถ้ามี GAS ให้ยิงไปบันทึกในชีตด้วย (ต้องมีฟังก์ชัน updateField ใน Apps Script)
          if(hasGAS()){
            google.script.run
              .withSuccessHandler(()=>{})
              .withFailureHandler(err=>console.warn('updateField failed:', err))
              .updateField(Number(row), field, value);
          }
        });
      });

      // steps toggle
      document.querySelectorAll('.stepbtn').forEach(btn=>{
        btn.onclick = (e)=>{
          const tr = e.target.closest('tr');
          const row = tr ? tr.getAttribute('data-row') : '';
          const col = btn.getAttribute('data-step');

          // local toggle first
          const id = tr.getAttribute('data-id');
          const idx = masterData.findIndex(x => String(x.ID) === String(id));
          if(idx >= 0){
            const cur = String(masterData[idx][col]||'').toLowerCase().trim();
            masterData[idx][col] = (cur === 'done') ? '' : 'done';
            saveLocal();
          }

          // UI toggle
          btn.classList.toggle('done');
          btn.classList.toggle('pending');

          // GAS toggle
          if(hasGAS()){
            google.script.run
              .withSuccessHandler(res => { if(res && res.ok) fetchData(); })
              .withFailureHandler(err => console.warn('toggleStep failed:', err))
              .toggleStep(Number(row), col);
          }
        };
      });
    }

    // ===== Filter / Sort =====
    function filterData() {
      const q = document.getElementById('qSearch').value.toLowerCase();
      const sort = document.getElementById('sortPrice').value;
      const beds = document.getElementById('bedSearch').value;
      const typeDropdown = document.getElementById('typeFilter').value;

      let filtered = masterData.filter(p => {
        const text = `${p.Zone} ${p.ID} ${p.Notes} ${p.Type} ${p.Source_URL}`.toLowerCase();
        const textMatch = text.includes(q);
        const bedMatch = beds === "" || String(p.Bedrooms) === String(beds);

        const pillMatch = (activePill === "all" || String(p.Type).trim() === activePill);
        const ddMatch = (typeDropdown === "" || String(p.Type).trim() === typeDropdown);

        return textMatch && bedMatch && pillMatch && ddMatch;
      });

      if (sort === "low") filtered.sort((a, b) => Number(a.Price||0) - Number(b.Price||0));
      if (sort === "high") filtered.sort((a, b) => Number(b.Price||0) - Number(a.Price||0));

      render(filtered);
    }

    // ===== Modal =====
    function toggleModal() {
      const m = document.getElementById('modal');
      m.style.display = (m.style.display === 'block') ? 'none' : 'block';
    }

    document.getElementById('addForm').onsubmit = (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = "SAVING...";

      const fd = Object.fromEntries(new FormData(e.target));

      // local fallback add (ถ้าไม่ผ่าน GAS)
      if(!hasGAS()){
        const newId = "TMP-" + String(Date.now()).slice(-6);
        masterData.unshift({
          ID:newId,
          Type:fd.Type,
          Zone:fd.Zone,
          Price:Number(fd.Price||0),
          Bedrooms:Number(fd.Bedrooms||0),
          Notes:fd.Notes||'',
          Source_URL:fd.Source_URL||'',
          Step1_Talk:'',Step2_Survey:'',Step3_Post:'',Step4_Other:'',
          _row: '' // ไม่มีใน local
        });
        saveLocal();
        toggleModal();
        e.target.reset();
        saveBtn.textContent = "SAVE TO DATABASE";
        filterData();
        return;
      }

      // GAS save
      google.script.run
        .withSuccessHandler(res => {
          if(res && res.ok){
            toggleModal();
            e.target.reset();
            saveBtn.textContent = "SAVE TO DATABASE";
            fetchData();
          }else{
            saveBtn.textContent = "SAVE TO DATABASE";
            alert("Save failed");
          }
        })
        .withFailureHandler(err=>{
          saveBtn.textContent = "SAVE TO DATABASE";
          alert("GAS Error: " + (err && err.message ? err.message : err));
        })
        .saveNewListing(fd);
    };

    // ===== Pills =====
    document.getElementById('pillBox').addEventListener('click', (e) => {
      if (e.target.classList.contains('pill')) {
        document.querySelectorAll('.pill').forEach(el => el.classList.remove('active'));
        e.target.classList.add('active');
        activePill = e.target.dataset.f;
        filterData();
      }
    });

    // ===== NOTE (สำคัญ) =====
    // ถ้าคุณใช้หน้านี้กับ Google Apps Script จริง:
    // - ต้องมีฟังก์ชัน getSmartData(), saveNewListing(fd), toggleStep(row,col)
    // - และ "เพิ่ม" ฟังก์ชัน updateField(row, field, value) ใน Apps Script
    //   เพื่อให้การแก้ไขในตาราง (เหมือน Excel) บันทึกลงชีตได้ทันที
  </script>
</body>
</html>
